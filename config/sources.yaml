# Fuentes oficiales que alimentan el RAG.
#
# Campos:
#   id           identificador único (se usa con --only)
#   title        nombre completo (se muestra al citar)
#   short_title  nombre corto para los encabezados de las citas
#   institution  dependencia emisora
#   url          URL oficial (PDF o página HTML)
#   format       pdf | html
#   parser       ley (por artículo) | sat_fichas (por ficha de trámite) | html | generic
#   version      opcional; en leyes se detecta "Última reforma DOF dd-mm-aaaa"
#
# Para agregar una fuente: añade un bloque y corre `python -m app.rag.ingest --only <id>`.

sources:
  # --- SAT: fichas de trámites fiscales (quién, dónde, requisitos, pasos) ---
  - id: sat-anexo2-rmf-2026
    title: "Anexo 2 de la Resolución Miscelánea Fiscal para 2026 — Trámites fiscales (SAT)"
    short_title: "Anexo 2 RMF 2026"
    institution: SAT
    url: https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/documentos2026/rmf/anexos/Anexo-2-RMF-2026_DOF-28122025.pdf
    format: pdf
    parser: sat_fichas
    version: "DOF 28-12-2025"

  # --- Leyes federales (Cámara de Diputados, texto vigente) ---
  - id: cpeum
    title: "Constitución Política de los Estados Unidos Mexicanos"
    short_title: "Constitución"
    institution: Cámara de Diputados
    url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf
    parser: ley

